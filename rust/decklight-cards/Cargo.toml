[package]
name = "decklight-cards"
description = "Card store: BabelCDB card stats and CardScripts index in layers (port of decklight.engine.resources), .ydk decks, the seeded deck shuffle"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
ygoenv-sys = { path = "../ygoenv-sys" }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
