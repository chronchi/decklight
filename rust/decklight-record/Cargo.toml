[package]
name = "decklight-record"
description = "Match record v1 (ADR 0010): the shared writer used by the web server and the EDOPro network host"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "decklight_record"
path = "src/lib.rs"

[dependencies]
ygoenv-sys = { path = "../ygoenv-sys" }
serde_json = "1"
flate2 = "1.1"
sha2 = "0.10"
rusqlite = { version = "0.42", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
