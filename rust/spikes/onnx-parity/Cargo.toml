[package]
name = "onnx-parity"
version = "0.1.0"
edition = "2021"

[workspace] # standalone spike, not part of rust/ workspace (brief S2)

[features]
# Exactly one of these is enabled per build: `--features ort` or `--features tract`.
ort = ["dep:ort"]
tract = ["dep:tract-onnx"]

[dependencies]
ndarray = "0.17"
ndarray-npy = "0.10"
serde_json = "1"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray", "api-31"], optional = true }
tract-onnx = { version = "0.22", optional = true }

[profile.release]
opt-level = 3
