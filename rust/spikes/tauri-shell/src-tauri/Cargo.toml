[package]
name = "s3-shell"
version = "0.1.0"
description = "S3 spike: Tauri 2 Android shell serving web/ from an in-app loopback server"
authors = ["decklight"]
license = ""
edition = "2021"

[lib]
name = "s3_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = { version = "0.8", features = ["ws"] }
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
rand = "0.9"
base64 = "0.22"
android_logger = "0.13"
