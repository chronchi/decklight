  '<div class="rowbtns"><button class="btn dz">Delete</button><button class="btn">Cancel</button></div></div><div class="delbar" style="display:none">');

// ---- Export a game or part of it (user 2026-11-15: "it can export anything, either whole game or parts of it") ------------
IA.share = '<svg class="ico" viewBox="0 0 24 24"><path d="M12 4v11M8 8l4-4 4 4"/><path d="M6 12v6.5A1.5 1.5 0 0 0 7.5 20h9a1.5 1.5 0 0 0 1.5-1.5V12"/></svg>';
const gHeadX = (t, sub) => '<div class="g-head"><button class="ibtn" aria-label="Back">' + I.back + '</button><div class="t">' + t + '<div class="sub">' + sub + '</div></div>' +
  '<button class="ibtn" aria-label="Export this game">' + IA.share + "</button></div>";
const xpWhat = (cur) => '<div class="xp-sec">What</div><div class="ptabs" role="radiogroup" aria-label="What to export" style="margin-top:0">' +
  [["game", "Whole game · 7 turns"], ["turn", "Turn 2"], ["range", "Turns…"], ["moment", "One play"]].map(([k, l]) =>
    '<button role="radio" aria-checked="' + (k === cur) + '"' + (k === cur ? ' class="sel"' : "") + ">" + l + "</button>").join("") + "</div>";
const xpRow = (sel, tag, name, desc, off) => '<div class="xp-row' + (sel ? " sel" : "") + (off ? " off" : "") + '" role="radio" aria-checked="' + !!sel + '"' + (off ? ' aria-disabled="true"' : "") + '>' +
  '<span class="ai" aria-hidden="true">' + tag + '</span><div><div class="an">' + name + '</div><div class="ad">' + desc + '</div></div><span class="radio' + (sel ? " on" : "") + '"></span></div>';
const xpAs = (cur, what) => '<div class="xp-sec">As</div><div role="radiogroup" aria-label="Format">' +
  xpRow(cur === "mp4", "MP4", "Video", what === "game" ? "Plays like the replay, 1.6 s a play · about 2 min 40 s · 9 MB" : "Plays like the replay, 1.6 s a play · about 18 s · 1.2 MB") +
  xpRow(cur === "gif", "GIF", "Animated GIF", what === "game" ? "Too long for a GIF (about 40 MB): pick a turn or a few turns" : "Loops in any chat, no sound · about 18 s · 3.5 MB", what === "game") +
  xpRow(cur === "png", "PNG", "Image", what === "moment" ? "The board at this play, with its caption" : "One image a turn: the board after its last play") +
  xpRow(cur === "yrp", "YRP", "EDOPro replay (.yrpX)", what === "game" ? "Open it in EDOPro: Replay, pick the file, Start. Tiny (6 KB)"
    : what === "moment" ? "EDOPro replays always start at turn 1: this one plays up to this play and stops"
    : "EDOPro replays always start at turn 1: this one plays turns 1–" + (what === "turn" ? "2" : "4") + " and stops") +
  xpRow(cur === "txt", "TXT", "Text", "The plays as text, to paste anywhere") + "</div>";
const xpHands = '<div class="xp-opt"><div>Opponent’s hand<div class="ad">As you saw it in the duel: face down until played</div></div><div class="xp-seg" role="radiogroup" aria-label="Opponent hand"><button class="sel" aria-checked="true">Hidden</button><button>Shown</button></div></div>';
const xpSpeed = '<div class="xp-opt"><div>Speed</div><div class="xp-seg" role="radiogroup" aria-label="Speed"><button>Slow</button><button class="sel" aria-checked="true">Normal</button><button>Fast</button></div></div>';
const xpSheet = (body) => ({overlay: '<div class="scrim"></div><div class="bsheet" role="dialog" aria-modal="true" aria-label="Export"><div class="grab"></div>' + body + "</div>"});
const xpGame = (inner) => shell("play", '<div style="overflow:auto;margin:0 -18px;padding:0 18px">' + gHeadX("Blue-Eyes vs Branded", "Bot · Duel · 2 h ago") + gameCardHere + inner + "</div>");
const xpFoot = (t, b) => '<div class="xp-foot"><div class="t">' + t + '</div><button class="btn pri">' + b + "</button></div>";
screens["export-sheet"] = () => xpGame("") + xpSheet('<h2>Export</h2>' + xpWhat("game") + xpAs("mp4", "game") + xpHands + xpSpeed +
  xpFoot("Made on this phone in about 1 min. Keep the app open while it draws (it pauses if you leave).", "Make video")).overlay;
screens["export-range"] = () => xpGame("") + xpSheet('<h2>Export</h2>' + xpWhat("range") +
  '<div class="xp-rng">From turn <span class="xp-step"><button aria-label="Earlier">‹</button><b>2</b><button aria-label="Later">›</button></span> to turn <span class="xp-step"><button aria-label="Earlier">‹</button><b>4</b><button aria-label="Later">›</button></span></div>' +
  '<p class="help" style="margin:2px 2px 0">14 plays · you went 2nd, so even turns are yours</p>' +
  xpAs("gif", "range") + xpHands + xpFoot("About 18 s · 3.5 MB", "Make GIF")).overlay;
screens["export-moment"] = () => shell("play", '<div style="overflow:auto;margin:0 -18px;padding:0 18px">' + gHeadX("Blue-Eyes vs Branded", "Bot · Duel · 2 h ago") + seqBlock2X(2) + "</div>") +
  xpSheet('<h2>Export</h2>' + xpWhat("moment") + '<p class="help" style="margin:0 2px">Turn 1 · play 3 of 4: “The chain resolves: Branded Fusion is negated”. Move the replay to pick another play.</p>' +
  xpAs("png", "moment").replace(/<div class="xp-row[^"]*"[^>]*><span class="ai" aria-hidden="true">(MP4|GIF)<\/span>[\s\S]*?<\/span><\/div>/g, "") + xpHands + xpFoot("1080 × 1920 · about 400 KB", "Share or save file")).overlay;
const seqBlock2X = (k) => seqBlock2(k).replace('Opponent’s plays</div>', 'Opponent’s plays<button class="xp-ic" aria-label="Export this turn">' + IA.share + "</button></div>");
screens["export-making"] = () => xpGame("") + xpSheet('<h2>Making the video</h2><p class="help" style="margin:2px 2px 0">Whole game · 7 turns · 94 plays</p>' +
  '<div class="xp-prog" role="progressbar" aria-valuenow="38" aria-valuemin="0" aria-valuemax="94" aria-label="Plays drawn"><i style="width:40%"></i></div>' +
  '<div style="display:flex;font-size:13px"><span>38 of 94 plays · turn 3</span><span style="margin-left:auto;color:var(--muted)">about 35 s left</span></div>' +
  '<p class="help" style="margin-top:12px">The app draws each play with the same board as the replay. If you leave the app it pauses here and carries on when you come back.</p>' +
  '<div class="xp-foot"><div class="t"></div><button class="btn">Cancel</button></div>').overlay;
screens["export-ready"] = () => xpGame("") + xpSheet('<h2>Video ready</h2>' +
  '<div class="xp-ready"><div class="th" aria-hidden="true">' + board2(FR2[2].g) + '</div><div style="flex:1"><div style="font-size:14.5px">Blue-Eyes vs Branded.mp4</div>' +
  '<div class="help" style="margin:4px 0 0">2 min 38 s · 720 × 1280 · 8.7 MB</div><div class="help" style="margin:2px 0 0">Whole game · opponent’s hand hidden</div></div></div>' +
  '<div class="xp-foot"><div class="t">Opens Android’s share sheet: send it in a chat, or save it to Files or Drive.</div><button class="btn pri">Share or save file</button></div>').overlay;
screens["export-failed"] = () => xpGame("") + xpSheet('<h2>Export</h2>' +
  '<div class="err" role="alert" style="margin-top:8px"><div class="h">' + I.warn + 'This phone cannot make MP4 video</div>' +
  '<p>Its video encoder refused H.264 at 720p (“NotSupportedError”). Make a GIF of a few turns instead, or export the EDOPro replay and record it there.</p>' +
  '<div class="acts"><button class="btn">Make a GIF</button><button class="btn">EDOPro replay</button></div></div>').overlay;
screens["export-many"] = () => screens["games-select"]().replace('<div class="delbar"><button class="btn dz">' + IA.trash + ' Delete 3 games</button></div>',
  '<div class="delbar"><button class="btn">' + IA.share + ' Export 3</button><button class="btn dz">' + IA.trash + ' Delete 3</button></div>');
screens["export-many-sheet"] = () => screens["export-many"]().replace(/<div class="delbar">[\s\S]*$/, "") + xpSheet('<h2>Export 3 games</h2>' +
  '<div class="xp-sec">As</div><div role="radiogroup" aria-label="Format">' +
  xpRow(true, "YRP", "EDOPro replays (.yrpX)", "One file per game, sent together · 18 KB") +
  xpRow(false, "TXT", "Text", "All three games’ plays in one text") +
  xpRow(false, "MP4", "Video", "One game at a time: open the game and export it there", true) + "</div>" +
  xpFoot("“Branded vs Labrynth” did not finish: its replay stops where the game stopped.", "Share or save files")).overlay;
screens["export-frame"] = () => '<div style="padding:18px"><div class="lbl" style="margin-top:0">What the video and GIF look like</div>' +
  '<p class="intro">One frame per play, drawn with the replay’s board (GY, banished, Deck, Extra, the chain) and caption; 9:16 so it fills a phone in any chat. The title names the decks and the turn; the bottom line says who played what.</p>' +
  '<div class="xp-frame"><div class="ft"><b style="font-weight:500">Blue-Eyes vs Branded</b><span class="r">Turn 1 · play 4 of 4</span></div>' +
  board2(FR2[3].g) + cap2(FR2[3]) + '<div class="fm"><span>YOU · BLUE-EYES  ·  OPP · BRANDED</span><span>DECKLIGHT</span></div></div></div>';
Promise.all(TABS.map(([k]) => fetch("/web/assets/icons/" + k + ".svg").then((r) => r.text()).then((t) => { TI[k] = t; }))).then(() => {
  document.getElementById("app").innerHTML = (screens[v] || screens["play-bot"])() +
    '<div class="mocklabel">mock · ' + v + " · tab bar " + bar + "</div>";
  if (v === "ask-sequence" && !qs.has("f")) {
    let k = 0;
    setInterval(() => { k = (k + 1) % FRAMES.length; document.getElementById("seq").innerHTML = sequenceBlock(k, true); }, 1600);
  }
  if (qs.has("t")) document.getAnimations().forEach((a) => { a.pause(); a.currentTime = +qs.get("t"); });
});
document.querySelector(".lmark") && (document.querySelector(".lmark").innerHTML = "");
</script>
</body>
</html>
