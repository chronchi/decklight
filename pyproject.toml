[project]
name = "ygo-zero"
version = "0.0.1"
description = "Learn to pilot any Yu-Gi-Oh! deck (edo9300 ocgcore)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "meson>=1.4",
    "ninja>=1.11",
    "pybind11>=3.1.0",
]
gauntlet = [
    "ai-edge-litert>=2.2.0",
]
# Models: card text embeddings + BC policy. CPU-only torch on the laptop (ADR 0001); vast installs a CUDA wheel over it.
ml = [
    "torch>=2.9",
    "sentence-transformers>=5.1",
]
web = [
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "websockets>=13",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ygo_zero"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no built artifacts",
    "engine: needs build/core/libocgcore.so",
    "gpu: vast only",
]
