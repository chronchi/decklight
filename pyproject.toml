[project]
name = "decklight"
version = "0.2.2"
description = "Learn to pilot any Yu-Gi-Oh! deck (edo9300 ocgcore)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "meson>=1.4",
    "ninja>=1.11",
    "pybind11>=3.1.0",
]
gauntlet = [
    "ai-edge-litert>=2.2.0",
]
# Models: card text embeddings + BC policy. CPU-only torch on the laptop (ADR 0001); vast installs a CUDA wheel over it.
ml = [
    "torch>=2.9",
    "safetensors>=0.6",
    "sentence-transformers>=5.1",
]
web = [
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",
    "starlette>=0.37",
    "uvicorn>=0.29",
    "websockets>=13",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decklight"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
# 4 workers = the laptop's 4 cores (tests/conftest.py gives each one torch thread); the unit suite takes ~9 min.
# A hung test fails after 5 min instead of blocking the run. `-n 0` runs one test in-process.
addopts = "-n 4 --timeout 300"
markers = [
    "unit: fast, no built artifacts",
    "engine: needs build/core/libocgcore.so",
    "gpu: vast only",
    "slow: longer than 60 s even on a fast laptop (e.g. full-duel loopback)",
]
