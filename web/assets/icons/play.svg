<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <!-- Play: two cards fanned as in the decklight mark; the front card hides the back one. The node is the one
       accent mark: currentColor at rest, --accent when the tab is selected (.sel .node). -->
  <title>Play</title>
  <rect x="4.2" y="6.2" width="9" height="13" rx="1.6" transform="rotate(-14 8.7 12.7)"/>
  <rect x="10.2" y="4.6" width="9" height="13" rx="1.6" transform="rotate(10 14.7 11.1)" style="fill:var(--icon-fill,#141310)"/>
  <circle class="node" cx="14.7" cy="11.1" r="1.65" fill="currentColor" stroke="none"/>
</svg>
