<title>decklight</title>
<script>
// The saved theme before the first paint (Settings → Appearance; app.js applyTheme keeps it current), so a light
// choice never flashes the dark background. The Android web view reports the wrong scheme: ask the app's bridge.
(function () {
  try {
    var b = window.DecklightTheme, m = null;
    try { m = localStorage.getItem("ygo-theme"); } catch (e) { /* the app's saved choice below */ }
    m = m || (b && b.mode());
    var sys = b ? b.system() : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    if ((m === "system" ? sys : m) === "light") {
      document.documentElement.dataset.theme = "light"; document.documentElement.style.background = "#f5f1e8";
    }
  } catch (e) { /* dark */ }
})();
</script>
